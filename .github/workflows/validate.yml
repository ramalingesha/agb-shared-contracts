name: Validate Contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - "error-codes.json"
      - "api-response-schema.json"
      - "package.json"
      - "scripts/validate-error-codes.js"
      - ".github/workflows/validate.yml"
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate Shared Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Need history for changelog check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JSON syntax
        run: |
          echo "🔍 Validating JSON files..."
          node -e "JSON.parse(require('fs').readFileSync('error-codes.json', 'utf8'))" && echo "✅ error-codes.json is valid"
          node -e "JSON.parse(require('fs').readFileSync('api-response-schema.json', 'utf8'))" && echo "✅ api-response-schema.json is valid"
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))" && echo "✅ package.json is valid"

      - name: Run error code validation
        run: |
          node scripts/validate-error-codes.js

      - name: Check version consistency
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          ERROR_CODES_VERSION=$(node -p "require('./error-codes.json').version")
          API_SCHEMA_VERSION=$(node -p "require('./api-response-schema.json').version")

          echo "📦 package.json version: $PACKAGE_VERSION"
          echo "🔢 error-codes.json version: $ERROR_CODES_VERSION"
          echo "📋 api-response-schema.json version: $API_SCHEMA_VERSION"

          if [ "$PACKAGE_VERSION" != "$ERROR_CODES_VERSION" ]; then
            echo "❌ Version mismatch between package.json and error-codes.json"
            exit 1
          fi

          if [ "$PACKAGE_VERSION" != "$API_SCHEMA_VERSION" ]; then
            echo "❌ Version mismatch between package.json and api-response-schema.json"
            exit 1
          fi

          echo "✅ All versions are consistent"

      - name: Check CHANGELOG updated (on PR)
        if: github.event_name == 'pull_request'
        run: |
          # Check if schema files were modified
          if git diff --name-only origin/${{ github.base_ref }} HEAD | grep -E '(error-codes|api-response-schema)\.json'; then
            echo "📝 Schema files were modified, checking CHANGELOG..."
            
            if git diff origin/${{ github.base_ref }} HEAD -- CHANGELOG.md | grep -q '^+'; then
              echo "✅ CHANGELOG.md was updated"
            else
              echo "❌ Schema files were modified but CHANGELOG.md was not updated"
              echo "Please document your changes in CHANGELOG.md"
              exit 1
            fi
          else
            echo "ℹ️  No schema files modified, skipping CHANGELOG check"
          fi

      - name: Validate no breaking changes (on PR)
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Checking for breaking changes..."

          # Checkout base branch version
          git show origin/${{ github.base_ref }}:error-codes.json > /tmp/error-codes-base.json || echo "{}" > /tmp/error-codes-base.json

          # Check if any error codes were removed
          BASE_CODES=$(node -p "Object.keys(JSON.parse(require('fs').readFileSync('/tmp/error-codes-base.json', 'utf8')).errorCodes || {}).join(',')")
          CURRENT_CODES=$(node -p "Object.keys(require('./error-codes.json').errorCodes).join(',')")

          for code in $(echo $BASE_CODES | tr ',' ' '); do
            if ! echo $CURRENT_CODES | grep -q "$code"; then
              echo "❌ Breaking change detected: Error code $code was removed"
              echo "Error codes should never be removed, only deprecated"
              exit 1
            fi
          done

          echo "✅ No breaking changes detected"

      - name: Summary
        if: always()
        run: |
          echo "## Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ JSON syntax validation passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Error code validation passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Version consistency verified" >> $GITHUB_STEP_SUMMARY
