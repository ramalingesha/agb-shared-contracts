name: Validate Contracts

on:
  push:
    branches:
      - main
    paths:
      - "error-codes.json"
      - "api-response-schema.json"
      - "knowledge-api.schema.json"
      - "package.json"
      - "scripts/validate-error-codes.js"
      - "scripts/validate-knowledge-api-schema.js"
      - "scripts/generate-knowledge-types.js"
      - "types/knowledge-api/**"
      - "schemas/studio/**"
      - "examples/studio/**"
      - "types/studio/**"
      - "scripts/*studio*.js"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Validate Shared Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Need history for changelog check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON syntax
        run: |
          echo "🔍 Validating JSON files..."
          node -e "JSON.parse(require('fs').readFileSync('error-codes.json', 'utf8'))" && echo "✅ error-codes.json is valid"
          node -e "JSON.parse(require('fs').readFileSync('api-response-schema.json', 'utf8'))" && echo "✅ api-response-schema.json is valid"
          node -e "JSON.parse(require('fs').readFileSync('knowledge-api.schema.json', 'utf8'))" && echo "✅ knowledge-api.schema.json is valid"
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))" && echo "✅ package.json is valid"

      - name: Run contract validation scripts
        run: |
          npm run validate

      - name: Validate generated TypeScript types are up to date
        run: |
          npm run generate:types
          npm run generate:studio-types
          if ! git diff --exit-code -- types/knowledge-api/ types/studio/; then
            echo "❌ types/knowledge-api/ is stale — run 'npm run generate:types' and commit the result"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- types/knowledge-api/ types/studio/)" ]; then
            echo "❌ types/knowledge-api/ has untracked files after regeneration — commit the result"
            exit 1
          fi
          echo "✅ types/knowledge-api/ matches the schema"

      - name: Check version consistency
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          ERROR_CODES_VERSION=$(node -p "require('./error-codes.json').version")
          API_SCHEMA_VERSION=$(node -p "require('./api-response-schema.json').version")

          echo "📦 package.json version: $PACKAGE_VERSION"
          echo "🔢 error-codes.json version: $ERROR_CODES_VERSION"
          echo "📋 api-response-schema.json version: $API_SCHEMA_VERSION"

          if [ "$PACKAGE_VERSION" != "$ERROR_CODES_VERSION" ]; then
            echo "❌ Version mismatch between package.json and error-codes.json"
            exit 1
          fi

          if [ "$PACKAGE_VERSION" != "$API_SCHEMA_VERSION" ]; then
            echo "❌ Version mismatch between package.json and api-response-schema.json"
            exit 1
          fi

          echo "✅ All versions are consistent"

      - name: Summary
        if: always()
        run: |
          echo "## Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ JSON syntax validation passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Error code validation passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Version consistency verified" >> $GITHUB_STEP_SUMMARY
